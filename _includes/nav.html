{% assign nav_pages = site.pages | where_exp: "p", "p.title" | where_exp: "p", "p.url != '/'" | where_exp: "p", "p.nav != false" %}
{% if nav_pages.size > 0 %}
<div class="container">
  <ul id="navlist">
    <li{% if page.url == "/" %} class="active"{% endif %}><a href="{{ '/' | relative_url }}">{{ site.title }}</a></li>
    {% for p in nav_pages %}
    <li{% if page.url == p.url %} class="active"{% endif %}><a href="{{ p.url | relative_url }}">{{ p.title }}</a></li>
    {% endfor %}
  </ul>
</div>
{% endif %}
